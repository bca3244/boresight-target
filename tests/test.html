<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Engine tests</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; background: #111; color: #ddd; padding: 16px; }
  td, th { padding: 2px 10px; text-align: left; }
  .pass { color: #6c6; } .fail { color: #f66; font-weight: bold; }
</style>
</head>
<body>
<h1>Engine tests against reference readings</h1>
<p id="summary"></p>
<table id="results"><tr><th>#</th><th>Case</th><th>Expected</th><th>Got</th><th>Result</th></tr></table>
<script src="../js/data.js"></script>
<script src="../js/ballistics.js"></script>
<script>
// Reference readings (English units).
const CASES = [
  ['rifle', '223 Rem (5.56x45mm)', 55, 'Pointed', 1.5, 100, 3215, 0.239, 44.9, { 10: -1.17, 25: -0.66 }],
  ['rifle', '223 Rem (5.56x45mm)', 55, 'Pointed', 1.5, 200, 3215, 0.239, 31.2],
  ['rifle', '243 Win (6.16x51mm)', 100, 'Pointed', 1.5, 100, 3109, 0.386, 44.1],
  ['rifle', '308 Win (7.62x51mm)', 149, 'Pointed', 2.0, 100, 2796, 0.367, 45.8],
  ['rifle', '308 Win (7.62x51mm)', 149, 'Pointed', 2.0, 200, 2796, 0.367, 33.1, { 10: -1.40 }],
  ['rifle', '30-30 Winchester', 150, 'Flat Point', 1.5, 100, 2346, 0.219, 29.8],
  ['rifle', '6.5mm Creedmoor', 140, 'Boat-Tail', 2.0, 100, 2776, 0.572, 46.0],
  ['rifle', '6.5mm Creedmoor', 140, 'Boat-Tail', 2.0, 200, 2776, 0.572, 34.0],
  ['rifle', '300 Winchester Mag', 180, 'Pointed', 1.5, 150, 3018, 0.456, 36.8, { 22: -0.60 }],
  ['pistol', '9mm Luger (9x19mm)', 124, 'Round Nose', 0.9, 50, 1124, 0.152, 9.9, { 5: -0.44 }],
  ['pistol', '9mm Luger (9x19mm)', 124, 'Round Nose', 0.9, 25, 1124, 0.152, 'error'],
  ['shotgun', '12 gauge slug barrel', 1.0, 'Sabot Slug', 0.5, 100, 1400, 0.181, 4.6],
  ['shotgun', '20 gauge slug barrel', 0.625, 'Slug (full bore size)', 0.5, 50, 1680, 0.082, 10.7],
  ['rifle', '17 HMR', 17, 'Pointed', 0.9, 100, 2540, 0.148, 22.1],
  ['rifle', '17 HMR', 17, 'Pointed', 0.9, 200, 2540, 0.148, 11.0],
  ['rifle', '17 HMR', 17, 'Pointed', 0.9, 300, 2540, 0.148, 6.1],
  ['rifle', '17 HMR', 17, 'Pointed', 3.0, 75, 2540, 0.148, 'error'],
  ['pistol', '9mm Luger (9x19mm)', 124, 'Round Nose', 0.4, 25, 1124, 0.152, 7.8],
  ['pistol', '9mm Luger (9x19mm)', 124, 'Round Nose', 0.8, 25, 1124, 0.152, 11.9],
  ['pistol', '9mm Luger (9x19mm)', 110, 'Round Nose', 0.8, 25, 1166, 0.135, 'error'],
  ['pistol', '9mm Luger (9x19mm)', 116, 'Round Nose', 0.8, 25, 1148, 0.142, 12.1]
];

// Weight-list checks: [mode, caliber, first, step, last] of the version-1 lists.
const LISTS = [
  ['rifle', '223 Rem (5.56x45mm)', 28, 1, 92], ['rifle', '30-30 Winchester', 44, 2, 204],
  ['rifle', '300 Winchester Mag', 104, 4, 264], ['rifle', '17 HMR', 13, 1, null],
  ['rifle', '243 Win (6.16x51mm)', 44, 2, null], ['rifle', '308 Win (7.62x51mm)', 44, 3, null],
  ['rifle', '6.5mm Creedmoor', 76, 2, null], ['pistol', '9mm Luger (9x19mm)', 70, 2, null]
];

const table = document.getElementById('results');
let pass = 0, fail = 0, n = 0;
function row(name, expected, got, ok) {
  ok ? pass++ : fail++;
  const tr = table.insertRow();
  [++n, name, expected, got, ok ? 'PASS' : 'FAIL'].forEach((v, i) => { const td = tr.insertCell(); td.textContent = v; if (i === 4) td.className = ok ? 'pass' : 'fail'; });
}

const VELOCITY_CORRECTED = ['223 Rem (5.56x45mm)', '243 Win (6.16x51mm)', '6.5mm Creedmoor', '300 Winchester Mag', '12 gauge slug barrel', '20 gauge slug barrel'];
CASES.forEach(([mode, cal, wt, shape, sight, zero, vExp, bcExp, meetExp, offsets]) => {
  const ci = BTS.calibers(mode).indexOf(cal);
  const weight = BTS.weights(mode, ci, false).find(w => Math.abs((mode === 'shotgun' ? w.ounces : w.grains) - wt) < 1e-9);
  const shapeObj = BTS.shapes(mode, ci).find(s => s.label === shape);
  const tag = `${cal} ${wt} ${shape} ${sight}" @ ${zero}`;
  if (ci < 0 || !weight || !shapeObj) { row(tag, 'caliber/weight/shape in lists', 'missing', false); return; }
  const v = BTS.typicalVelocityFps(mode, ci, weight);
  const bc = BTS.typicalBc(mode, ci, weight, shapeObj.index);
  // These typical velocities were later corrected to factory figures (checked below), so only the engine part still applies.
  if (!VELOCITY_CORRECTED.includes(cal)) row(tag + ' velocity', vExp, v, v === vExp);
  row(tag + ' B.C.', bcExp.toFixed(3), bc.toFixed(3), bc.toFixed(3) === bcExp.toFixed(3));
  const sol = BTS.solve(vExp, bc, sight, zero);
  if (meetExp === 'error') { row(tag + ' zero refused', 'error', sol.rising ? 'error' : sol.meetYd.toFixed(2), sol.rising); return; }
  row(tag + ' meet', meetExp.toFixed(1), sol.meetYd.toFixed(2) + (sol.rising ? ' (refused)' : ''), !sol.rising && sol.meetYd.toFixed(1) === meetExp.toFixed(1));
  for (const r in offsets || {}) {
    const off = BTS.laserOffset(sight, sol.meetYd, Number(r));
    row(tag + ' laser at ' + r + ' yd', offsets[r].toFixed(2), off.toFixed(2), off.toFixed(2) === offsets[r].toFixed(2));
  }
});

// The version-1 lists (kept for old links) must stay the same...
LISTS.forEach(([mode, cal, first, step, last]) => {
  const list = BTS.v1Weights(mode, BTS.calibers(mode).indexOf(cal), false).map(w => w.grains);
  const got = `${list[0]}, step ${list[1] - list[0]}, last ${list[list.length - 1]}`;
  row(cal + ' version-1 weight list', `${first}, step ${step}` + (last ? `, last ${last}` : ''), got,
      list[0] === first && list[1] - list[0] === step && (last === null || list[list.length - 1] === last));
});
// ...while the page's lists cover the same range in 1-grain steps.
LISTS.forEach(([mode, cal]) => {
  const ci = BTS.calibers(mode).indexOf(cal);
  const orig = BTS.v1Weights(mode, ci, false).map(w => w.grains), list = BTS.weights(mode, ci, false).map(w => w.grains);
  const steps1 = list.every((g, i) => i === 0 || g - list[i - 1] === 1);
  const covers = orig.every(g => list.includes(g)) && list[0] === orig[0];
  row(cal + ' page weight list', `${orig[0]}+ in 1-gr steps, includes all version-1 weights`, `${list[0]}..${list[list.length - 1]}, 1-gr steps ${steps1}`, steps1 && covers);
});
{
  const ci = BTS.calibers('rifle').indexOf('350 Legend');
  const has = BTS.weights('rifle', ci, false).some(w => w.grains === 170);
  row('350 Legend offers 170 gr', 'yes', has ? 'yes' : 'no', has);
}

row('Sight cutoff: 0.9 in starts at 1', 1, BTS.targetRanges(0.9, 22.1)[0], BTS.targetRanges(0.9, 22.1)[0] === 1);
row('Sight cutoff: 1.5 in starts at 8', 8, BTS.targetRanges(1.5, 44.9)[0], BTS.targetRanges(1.5, 44.9)[0] === 8);

// Trajectory table, near zero, click and energy math.
{
  const sol = BTS.solve(2796, 0.367, 1.5, 100);
  const tbl = BTS.trajectoryTable(2796, 0.367, 1.5, sol.angle, [0, 50, 100, 200]);
  row('Table: muzzle row', '−1.50 in, 2796 fps', `${tbl[0].y.toFixed(2)} in, ${Math.round(tbl[0].v)} fps`, Math.abs(tbl[0].y + 1.5) < 0.005 && Math.round(tbl[0].v) === 2796);
  row('Table: on the sight line at the zero', '0.00 in', tbl[2].y.toFixed(3) + ' in', Math.abs(tbl[2].y) < 0.005);
  row('Table: slows and drops past the zero', 'v falls, 200 yd below line', `${Math.round(tbl[3].v)} fps, ${tbl[3].y.toFixed(2)} in`, tbl[3].v < tbl[2].v && tbl[2].v < tbl[1].v && tbl[3].y < -1);
  row('Table: time of flight grows', 't(200) > t(100) > 0', `${tbl[2].t.toFixed(3)} / ${tbl[3].t.toFixed(3)} s`, tbl[3].t > tbl[2].t && tbl[2].t > 0.1);
  const nz = BTS.nearZero(2796, 0.367, 1.5, sol.angle, 100);
  row('Near zero is between meet and zero', `${sol.meetYd.toFixed(1)} < near < 100`, nz && nz.toFixed(1), nz > sol.meetYd && nz < 100);
  const c1 = BTS.clicks(2.5, 100, { unit: 'moa', value: 0.25 }), c2 = BTS.clicks(2.5, 100, { unit: 'mil', value: 0.1 });
  row('Clicks: 2.5 in at 100 yd, ¼ MOA', '10 clicks (2.39 MOA)', `${c1.clicks} clicks (${c1.angle.toFixed(2)} MOA)`, c1.clicks === 10 && c1.angle.toFixed(2) === '2.39');
  row('Clicks: 2.5 in at 100 yd, 0.1 mil', '7 clicks (0.69 mil)', `${c2.clicks} clicks (${c2.angle.toFixed(2)} mil)`, c2.clicks === 7 && c2.angle.toFixed(2) === '0.69');
  const e = Math.round(BTS.energyFtLb(150, 2800));
  row('Energy: 150 gr at 2800 fps', '2611 ft-lb', e + ' ft-lb', e === 2611);

  // Wind drift (lag rule) and MOA / mil angles.
  const t3 = BTS.trajectoryTable(2790, 0.370, 1.5, BTS.solve(2790, 0.370, 1.5, 100).angle, [100, 300]);
  const d100 = BTS.windDriftIn(10, 100, t3[0].t, 2790), d300 = BTS.windDriftIn(10, 300, t3[1].t, 2790);
  row('Drift: 308 150 gr, 10 mph at 300 yd', '7 to 10 in', d300.toFixed(2) + ' in', d300 > 7 && d300 < 10);
  row('Drift grows with range', '100 yd < 300 yd', `${d100.toFixed(2)} < ${d300.toFixed(2)}`, d100 > 0 && d100 < d300);
  row('Drift is proportional to wind', '20 mph = 2 × 10 mph', (BTS.windDriftIn(20, 300, t3[1].t, 2790) / d300).toFixed(4), Math.abs(BTS.windDriftIn(20, 300, t3[1].t, 2790) / d300 - 2) < 1e-9);
  row('No wind, no drift', '0', String(BTS.windDriftIn(0, 300, t3[1].t, 2790)), BTS.windDriftIn(0, 300, t3[1].t, 2790) === 0);
  const t4 = BTS.trajectoryTable(2790, 0.200, 1.5, BTS.solve(2790, 0.200, 1.5, 100).angle, [300]);
  row('Lower B.C. drifts more', '> ' + d300.toFixed(2), BTS.windDriftIn(10, 300, t4[0].t, 2790).toFixed(2), BTS.windDriftIn(10, 300, t4[0].t, 2790) > d300);
  row('1.0472 in at 100 yd is 1 MOA', '1.000', BTS.angleOf(1.0472, 100, 'moa').toFixed(3), BTS.angleOf(1.0472, 100, 'moa').toFixed(3) === '1.000');
  row('7.2 in at 200 yd is 1 mil', '1.000', BTS.angleOf(7.2, 200, 'mil').toFixed(3), BTS.angleOf(7.2, 200, 'mil').toFixed(3) === '1.000');
}

// Every caliber, both unit systems: lists are non-empty, values are finite, and a default solve works.
['rifle', 'pistol', 'shotgun'].forEach(mode => {
  let bad = [];
  BTS.calibers(mode).forEach((cal, ci) => {
    [false, true].forEach(metric => {
      const ws = BTS.weights(mode, ci, metric), ss = BTS.shapes(mode, ci), sights = BTS.sightHeights(mode, metric);
      if (!ws.length || !ss.length || !sights.length || ws.some(w => !(w.grains > 0))) { bad.push(cal + (metric ? ' (metric)' : '') + ': empty list'); return; }
      if (metric && mode !== 'shotgun' && ws.length < 11) bad.push(cal + ': fewer than 11 metric weights');
      const w = ws[Math.floor(ws.length / 2)];
      const v = BTS.typicalVelocityFps(mode, ci, w), bc = BTS.typicalBc(mode, ci, w, ss[0].index);
      if (!(v > 0 && bc > 0)) { bad.push(cal + ': velocity ' + v + ', B.C. ' + bc); return; }
      const zero = BTS.zeroRanges(mode).slice(-1)[0];
      const sol = BTS.solve(v, bc, 1.5, zero);
      if (!isFinite(sol.meetYd)) bad.push(cal + ': solve failed');
    });
  });
  row(`All ${mode} calibers build lists and solve`, 'no problems', bad.length ? bad.slice(0, 3).join('; ') + (bad.length > 3 ? ' …' : '') : 'no problems', bad.length === 0);
});

// Point-blank range: 308 Win 150 gr (2790 fps, G1 0.370), 1.5 in sight, 6 in vital zone (±3 in).
{
  const p = BTS.pointBlank(2790, 0.370, 1.5, 3);
  row('Point-blank path peaks exactly at the zone edge', '+3.000 in', '+' + p.apexIn.toFixed(3) + ' in at ' + p.apexYd.toFixed(0) + ' yd', Math.abs(p.apexIn - 3) < 0.001);
  row('Point-blank range for a 6 in zone', '268 to 272 yd', p.endYd.toFixed(1) + ' yd', p.endYd > 268 && p.endYd < 272);
  row('Best zero for a 6 in zone', '228 to 234 yd', p.farZeroYd.toFixed(1) + ' yd', p.farZeroYd > 228 && p.farZeroYd < 234);
  const sol = BTS.solve(2790, 0.370, 1.5, p.farZeroYd);
  row('Zeroing at the best zero gives the same path', 'same bore angle', Math.abs(sol.angle - p.angle).toExponential(1) + ' rad apart', Math.abs(sol.angle - p.angle) < 1e-9);
  const t = BTS.trajectoryTable(2790, 0.370, 1.5, p.angle, [p.endYd]);
  row('Bullet is 3 in low at the point-blank range', '-3.00 in', t[0].y.toFixed(2) + ' in', Math.abs(t[0].y + 3) < 0.01);
  const small = BTS.pointBlank(2790, 0.370, 1.5, 2);
  row('A smaller zone gives a shorter point-blank range', '< ' + p.endYd.toFixed(0) + ' yd', small.endYd.toFixed(1) + ' yd', small.endYd < p.endYd && small.farZeroYd < p.farZeroYd);
  const mine = BTS.pointBlankAt(2790, 0.370, 1.5, BTS.solve(2790, 0.370, 1.5, 100).angle, 3, 2000);
  row('A 100 yd zero stays in the zone for less distance', '< ' + p.endYd.toFixed(0) + ' yd', mine.endYd.toFixed(1) + ' yd', mine.apexIn < 3 && mine.endYd < p.endYd);
  const high = BTS.pointBlankAt(2790, 0.370, 1.5, BTS.solve(2790, 0.370, 1.5, 300).angle, 3, 2000);
  row('A 300 yd zero rises above a 6 in zone', '> 3 in', '+' + high.apexIn.toFixed(2) + ' in', high.apexIn > 3);
  const sightHigh = BTS.pointBlank(2790, 0.370, 3, 2);   // sight 3 in above the bore, ±2 in zone
  row('A tall sight starts the zone a little out from the muzzle', '> 0 yd', sightHigh.startYd.toFixed(1) + ' yd', sightHigh.startYd > 0 && sightHigh.startYd < sightHigh.nearZeroYd);
}

// Shot angle: 308 Win 150 gr zeroed at 100 yd on level ground, shot 30° up or down at line-of-sight ranges.
{
  const a = BTS.solve(2790, 0.370, 1.5, 100).angle, R = [100, 300, 500];
  const flat = BTS.trajectoryTable(2790, 0.370, 1.5, a, R), level = BTS.trajectoryTable(2790, 0.370, 1.5, a, R, 0);
  row('Shot angle 0 is the level table', 'same path', (level[2].y - flat[2].y).toExponential(1) + ' in apart', R.every((r, i) => level[i].y === flat[i].y));
  const up = BTS.trajectoryTable(2790, 0.370, 1.5, a, R, 30), down = BTS.trajectoryTable(2790, 0.370, 1.5, a, R, -30);
  row('Uphill and downhill shots hit high', 'both above level at 300 and 500 yd', `level ${flat[2].y.toFixed(1)}, up ${up[2].y.toFixed(1)}, down ${down[2].y.toFixed(1)} in at 500 yd`,
      [1, 2].every(i => up[i].y > flat[i].y + 1 && down[i].y > flat[i].y + 1));
  // Rifleman's rule: only g x cos(angle) bends the path away from the line of sight.
  const bore = r => 12 * r * 3 * Math.tan(a) - 1.5, rule = i => bore(R[i]) - Math.cos(Math.PI / 6) * (bore(R[i]) - flat[i].y);
  row("30° up at 500 yd is close to the rifleman's rule", `${rule(2).toFixed(1)} in, within 1 in`, up[2].y.toFixed(1) + ' in', Math.abs(up[2].y - rule(2)) < 1);
  row('Uphill drops a little more than downhill (gravity slows the bullet)', 'up below down at 500 yd', `up ${up[2].y.toFixed(2)}, down ${down[2].y.toFixed(2)} in`, up[2].y < down[2].y && down[2].y - up[2].y < 1);
  row('Uphill bullets arrive slower', 'lower velocity', `up ${up[2].v.toFixed(0)}, down ${down[2].v.toFixed(0)} fps`, up[2].v < flat[2].v && down[2].v > flat[2].v);
}

// Caliber data checks: names, rifle at least as fast as pistol, and loads checked against factory figures.
{
  const vel = (mode, name, grains) => BTS.typicalVelocityFps(mode, BTS.calibers(mode).indexOf(name), { grains });
  const names = ['284 Winchester', '357 Magnum', '450/400 Nitro Express 3"', '450 Nitro Express 3¼"', '500/416 Nitro Express', '6XC'];
  const missing = names.filter(n => !BTS.calibers('rifle').includes(n));
  row('Corrected caliber names', 'all listed', missing.length ? 'missing: ' + missing.join(', ') : 'all listed', !missing.length);
  const slower = BTS.calibers('pistol').filter(n => BTS.calibers('rifle').includes(n)).filter(n => {
    const r = BTS_DATA.pistol[BTS.calibers('pistol').indexOf(n)], g = r[7] || (r[2] + r[3]) / 2;
    return vel('rifle', n, g) < vel('pistol', n, g);
  });
  row('A rifle is never slower than a pistol with the same load', 'none slower', slower.length ? slower.join(', ') : 'none slower', !slower.length);
  const near = (got, want, tol) => Math.abs(got - want) <= tol;
  const checks = [['pistol', '5.7x28mm', 40, 1738], ['rifle', '350 Legend', 145, 2350], ['rifle', '350 Legend', 180, 2100],
    ['rifle', '454 Casull', 300, 1846], ['rifle', '300 Blackout', 110, 2350], ['rifle', '30 Nosler', 210, 3000]];
  checks.forEach(([mode, name, g, want]) => {
    const v = vel(mode, name, g);
    row(`${name} ${g} gr (${mode}) is near the factory ${want} fps`, `${want} ± 100`, v + ' fps', near(v, want, 100));
  });
  // Typical B.C.s against common factory bullets: [mode, caliber, grains, shape, low, high].
  const bcOf = (mode, name, grains, shape) => {
    const i = BTS.calibers(mode).indexOf(name), s = BTS.shapes(mode, i).find(x => x.label === shape);
    return s ? BTS.typicalBc(mode, i, { grains }, s.index) : NaN;
  };
  [['rifle', '6.5x52mm Carcano', 139, 'Boat-Tail', 0.42, 0.52], ['rifle', '6.5x50mm Japanese', 139, 'Boat-Tail', 0.42, 0.52],
   ['rifle', '22 Hornet', 35, 'Boat-Tail', 0.11, 0.16], ['rifle', '350 Legend', 150, 'Boat-Tail', 0.22, 0.27],
   ['pistol', '357 Magnum', 158, 'Ball', 0.13, 0.18], ['pistol', '38 Special', 130, 'Ball', 0.1, 0.16],
   ['pistol', '40 S&W', 180, 'Truncated Cone', 0.14, 0.19], ['pistol', '45 ACP', 200, 'Semi-Wadcutter', 0.13, 0.17],
   ['pistol', '460 S&W Magnum', 300, 'Flat Point', 0.16, 0.21], ['pistol', '32 Short Colt', 80, 'Round Nose', 0.08, 0.12]
  ].forEach(([mode, name, g, shape, lo, hi]) => {
    const bc = bcOf(mode, name, g, shape);
    row(`${name} ${g} gr ${shape} B.C.`, `${lo}–${hi}`, isNaN(bc) ? 'shape missing' : bc.toFixed(3), bc >= lo && bc <= hi);
  });
  row('350 Legend boat-tail is above its pointed bullet', 'boat-tail higher', `${bcOf('rifle', '350 Legend', 150, 'Boat-Tail').toFixed(3)} vs ${bcOf('rifle', '350 Legend', 150, 'Pointed').toFixed(3)}`,
      bcOf('rifle', '350 Legend', 150, 'Boat-Tail') > bcOf('rifle', '350 Legend', 150, 'Pointed'));
  // Calibers added later, and the rows refitted to factory loads: [mode, caliber, grains, shape, fps, G1 B.C. or null].
  [['rifle', '7mm PRC', 175, 'Boat-Tail', 3000, 0.689], ['rifle', '7mm PRC', 180, 'Boat-Tail', 2975, null],
   ['rifle', '300 Norma Magnum', 215, 'Boat-Tail', 3017, 0.691], ['rifle', '300 Norma Magnum', 230, 'Boat-Tail', 2950, 0.743],
   ['rifle', '7mm Backcountry', 170, 'Boat-Tail', 3150, 0.645], ['rifle', '22 ARC', 75, 'Boat-Tail', 3075, 0.467], ['rifle', '22 ARC', 88, 'Boat-Tail', 2820, 0.545],
   ['rifle', '400 Legend', 215, 'Pointed', 2250, 0.206], ['rifle', '360 Buckhammer', 180, 'Flat Point', 2400, 0.178], ['rifle', '360 Buckhammer', 200, 'Flat Point', 2200, 0.181],
   ['rifle', '458 SOCOM', 300, 'Flat Point', 1850, null], ['rifle', '277 SIG Fury (6.8x51mm)', 150, 'Boat-Tail', 2950, null],
   ['rifle', '224 Valkyrie', 60, 'Boat-Tail', 3300, null], ['rifle', '224 Valkyrie', 90, 'Boat-Tail', 2700, null], ['rifle', '30 Nosler', 180, 'Boat-Tail', 3200, null],
   ['rifle', '243 Win (6.16x51mm)', 100, 'Pointed', 2960, null], ['rifle', '257 Roberts', 117, 'Pointed', 2780, null],
   ['rifle', '35 Whelen', 200, 'Pointed', 2675, null], ['rifle', '35 Whelen', 250, 'Pointed', 2400, null],
   ['rifle', '7mm Remington Mag', 150, 'Pointed', 3110, null], ['rifle', '7mm Remington Mag', 175, 'Pointed', 2860, null],
   ['rifle', '7.65x53mm Argentine', 174, 'Round Nose', 2600, null], ['rifle', '7.7x58mm Japanese', 174, 'Round Nose', 2380, null],
   ['pistol', '357 Magnum', 125, 'Flat Point', 1450, null], ['pistol', '357 Magnum', 158, 'Flat Point', 1240, null],
   ['pistol', '45 ACP', 185, 'Flat Point', 1000, null], ['pistol', '45 ACP', 230, 'Flat Point', 850, null],
   ['pistol', '40 S&W', 165, 'Flat Point', 1130, null], ['pistol', '40 S&W', 180, 'Flat Point', 1000, null],
   ['pistol', '30 Super Carry', 100, 'Flat Point', 1250, null], ['pistol', '30 Super Carry', 115, 'Flat Point', 1150, null]
  ].forEach(([mode, name, g, shape, fps, bc]) => {
    const v = vel(mode, name, g), b = bcOf(mode, name, g, shape);
    row(`${name} ${g} gr: factory ${fps} fps${bc ? ', B.C. ' + bc : ''}`, `±60 fps${bc ? ', ±0.03' : ''}`, `${v} fps, ${isNaN(b) ? 'no ' + shape : b.toFixed(3)}`,
        near(v, fps, 60) && !isNaN(b) && (!bc || near(b, bc, 0.03)));
  });
  // 30 Nosler's top weight came down (265 to 215 gr): every weight still in the list keeps its position, in both units.
  {
    const ni = BTS.calibers('rifle').indexOf('30 Nosler'), r = BTS_DATA.rifle[ni], now = [false, true].map(m => BTS.weights('rifle', ni, m));
    r[3] = 265; const before = [false, true].map(m => BTS.weights('rifle', ni, m)); r[3] = 215;
    const same = [0, 1].every(u => now[u].every((w, i) => Math.abs(w.grains - before[u][i].grains) < 1e-9));
    row('30 Nosler: weights keep their link positions', 'same positions, list ends at 258 gr', `${same ? 'same positions' : 'positions moved'}, ends at ${now[0][now[0].length - 1].label}`, same && now[0][now[0].length - 1].grains === 258);
  }
  // Every row: a sane diameter, range, velocity and B.C. at both ends of its weight list, and no repeated names.
  {
    const bad = [];
    ['rifle', 'pistol'].forEach(mode => {
      const names = BTS.calibers(mode);
      names.forEach((name, i) => {
        const r = BTS_DATA[mode][i], ws = BTS.weights(mode, i, false), ends = [ws[0], ws[ws.length - 1]];
        if (names.indexOf(name) !== i) bad.push(`${mode} ${name}: listed twice`);
        if (!(r[1] >= 0.17 && r[1] <= 0.52)) bad.push(`${mode} ${name}: diameter ${r[1]}`);
        if (!(r[2] <= r[3]) || !(r[5] >= 0)) bad.push(`${mode} ${name}: range or slope`);
        ends.forEach(w => { const v = BTS.typicalVelocityFps(mode, i, w); if (!(v >= 500 && v <= 4600)) bad.push(`${mode} ${name} ${w.label}: ${v} fps`); });
        const shapes = BTS.shapes(mode, i);
        if (!shapes.length) bad.push(`${mode} ${name}: no shapes`);
        shapes.forEach(s => ends.forEach(w => { const b = BTS.typicalBc(mode, i, w, s.index); if (!(b >= 0.02 && b <= 1.1)) bad.push(`${mode} ${name} ${w.label} ${s.label}: B.C. ${b}`); }));
      });
    });
    row('Every caliber row is sane (diameter, range, velocity 500–4600 fps, B.C. 0.02–1.1, unique name)', 'no problems', bad.length ? bad.slice(0, 6).join('; ') + (bad.length > 6 ? ` … ${bad.length} in all` : '') : 'no problems', !bad.length);
  }
  const common = BTS_DATA.rifle.filter(r => r[7] != null).concat(BTS_DATA.pistol.filter(r => r[7] != null));
  const outside = common.filter(r => r[7] < r[2] || r[7] > r[3]).map(r => r[0]);
  row('Common weights sit inside the typical range', common.length + ' rows, none outside', outside.length ? outside.join(', ') : common.length + ' rows, none outside', !outside.length && common.length > 20);
}

// The engine against published factory drop tables (1.5 in sight, 200 yd zero): Hornady 308 Win 168 gr ELD Match
// (2700 fps, G1 0.523) and Federal American Eagle 223 Rem 55 gr FMJ-BT (3240 fps, G1 0.269). [range, path in, fps or null].
[['Hornady 308 Win 168 gr ELD Match', 2700, 0.523, [[100, 2.0, 2530], [300, -8.2, 2210], [400, -23.5, 2058], [500, -47.0, 1913]]],
 ['Federal 223 Rem 55 gr FMJ-BT', 3240, 0.269, [[100, 1.4, 2874], [300, -6.8, 2222], [400, -20.6, null], [500, -44.2, null]]]
].forEach(([load, v0, bc, pub]) => {
  const t = BTS.trajectoryTable(v0, bc, 1.5, BTS.solve(v0, bc, 1.5, 200).angle, pub.map(p => p[0]));
  pub.forEach(([r, y, v], i) => {
    const okY = Math.abs(t[i].y - y) <= Math.max(0.3, Math.abs(y) * 0.02), okV = v == null || Math.abs(t[i].v - v) <= 15;
    row(`${load} at ${r} yd matches the maker's table`, `${y} in${v ? ', ' + v + ' fps' : ''}`, `${t[i].y.toFixed(1)} in, ${t[i].v.toFixed(0)} fps`, okY && okV);
  });
});

// Wind drift against Federal's Gold Medal 308 168 gr Sierra MatchKing table (2650 fps, G1 0.462); its 10 mph figures are the mean of the
// published 5 and 15 mph rows. Downrange velocity against Federal's 175 gr MatchKing table (2600 fps, G1 0.505).
{
  const R = [100, 200, 300, 400, 500, 600], drift = [0.8, 3.05, 7.4, 13.6, 22.2, 33.0];
  const t = BTS.trajectoryTable(2650, 0.462, 1.5, BTS.solve(2650, 0.462, 1.5, 100).angle, R);
  R.forEach((r, i) => {
    const d = BTS.windDriftIn(10, r, t[i].t, 2650);
    row(`Federal 168 gr MatchKing 10 mph drift at ${r} yd`, drift[i] + ' in', d.toFixed(1) + ' in', Math.abs(d - drift[i]) <= Math.max(0.2, drift[i] * 0.03));
  });
  const V = [2427, 2262, 2102, 1949, 1803], t2 = BTS.trajectoryTable(2600, 0.505, 1.5, BTS.solve(2600, 0.505, 1.5, 100).angle, R.slice(0, 5));
  row('Federal 175 gr MatchKing velocity at 100–500 yd', V.join(', '), t2.map(p => p.v.toFixed(0)).join(', '), t2.every((p, i) => Math.abs(p.v - V[i]) <= 10));
}

// Popular factory loads: typical velocity within 60 fps and boat-tail B.C. within 10%. [caliber, grains, fps, G1 B.C.]
[['308 Win (7.62x51mm)', 175, 2600, 0.505], ['308 Win (7.62x51mm)', 168, 2650, 0.462], ['6.5mm PRC', 143, 2960, 0.625], ['6.5mm Creedmoor', 143, 2700, 0.625],
 ['300 PRC', 212, 2860, 0.673], ['338 Lapua Magnum', 250, 2970, 0.648], ['338 Lapua Magnum', 300, 2690, 0.736],
 ['223 Rem (5.56x45mm)', 77, 2720, 0.372], ['223 Rem (5.56x45mm)', 55, 3240, 0.269], ['270 Winchester', 130, 3060, 0.46], ['30-06 Springfield', 165, 2790, 0.454],
 ['7mm-08 Remington', 140, 2860, 0.486], ['300 Winchester Mag', 180, 2960, 0.507]
].forEach(([name, g, fps, bc]) => {
  const i = BTS.calibers('rifle').indexOf(name), bt = BTS.shapes('rifle', i).find(s => s.label === 'Boat-Tail');
  const v = BTS.typicalVelocityFps('rifle', i, { grains: g }), b = bt ? BTS.typicalBc('rifle', i, { grains: g }, bt.index) : NaN;
  row(`${name} ${g} gr: factory ${fps} fps, B.C. ${bc}`, '±60 fps, ±10%', `${v} fps, ${isNaN(b) ? 'no boat-tail' : b.toFixed(3)}`, Math.abs(v - fps) <= 60 && Math.abs(b / bc - 1) <= 0.1);
});

// Slugs against factory loads: [gauge, ounces, fps]. Slug speeds vary a lot by maker, so within 120 fps.
[['12 gauge slug barrel', 1.0, 1560], ['12 gauge slug barrel', 0.625, 1900], ['20 gauge slug barrel', 0.5, 1800], ['20 gauge slug barrel', 0.625, 1700]]
  .forEach(([g, oz, fps]) => {
    const i = BTS.calibers('shotgun').indexOf(g), w = BTS.weights('shotgun', i, false).find(x => Math.abs(x.ounces - oz) < 1e-9);
    const v = BTS.typicalVelocityFps('shotgun', i, w);
    row(`${g} ${oz} oz slug is near the factory ${fps} fps`, `${fps} ± 120`, v + ' fps', Math.abs(v - fps) <= 120);
  });

document.getElementById('summary').textContent = `${pass} passed, ${fail} failed`;
document.title = `TESTS ${pass} passed ${fail} failed`;
</script>
