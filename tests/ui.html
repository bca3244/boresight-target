<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI tests</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; background: #111; color: #ddd; padding: 16px; }
  td, th { padding: 2px 10px; text-align: left; }
  .pass { color: #6c6; } .fail { color: #f66; font-weight: bold; }
  iframe { width: 1300px; height: 1000px; border: 0; position: absolute; left: -5000px; }
</style>
</head>
<body>
<h1>UI tests: caliber search, my setups, click calculator, trajectory table</h1>
<p id="summary">running…</p>
<table id="results"><tr><th>#</th><th>Check</th><th>Expected</th><th>Got</th><th>Result</th></tr></table>
<iframe id="f"></iframe>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const table = document.getElementById('results');
let pass = 0, fail = 0, n = 0;
function row(name, expected, got, ok) {
  ok ? pass++ : fail++;
  const tr = table.insertRow();
  [++n, name, expected, got, ok ? 'PASS' : 'FAIL'].forEach((v, i) => { const td = tr.insertCell(); td.textContent = v; if (i === 4) td.className = ok ? 'pass' : 'fail'; });
}
const frame = document.getElementById('f');
const load = hash => new Promise(res => { frame.onload = () => setTimeout(res, 50); frame.src = '../index.html?t=' + Math.random() + hash; });
const wait = ms => new Promise(r => setTimeout(r, ms));
const sel2 = (d, id) => d.getElementById(id).selectedOptions[0]?.textContent || '';
function set(d, id, value, ev = 'input') { const e = d.getElementById(id); e.value = value; e.dispatchEvent(new Event(ev, { bubbles: true })); }

(async () => {
  await load('');
  try { ['bts.saved', 'bts.loads', 'bts.slope', 'bts.plot', 'bts.windclock', 'bts.table.rifle', 'bts.table.pistol', 'bts.table.shotgun'].forEach(k => frame.contentWindow.localStorage.removeItem(k)); } catch (e) { /* storage blocked */ }
  await load('');   // again, so the chart starts from its default view
  const w = frame.contentWindow, d = frame.contentDocument;
  row('Install button stays hidden until the browser offers installing', 'hidden', d.getElementById('install').hidden ? 'hidden' : 'shown', d.getElementById('install').hidden);
  row('Page links the app manifest and icon', 'manifest + apple-touch-icon', (d.querySelector('link[rel=manifest]') ? 'manifest' : 'no manifest') + (d.querySelector('link[rel=apple-touch-icon]') ? ' + apple-touch-icon' : ''),
      !!d.querySelector('link[rel=manifest]') && !!d.querySelector('link[rel=apple-touch-icon]'));
  row('Chart opens on Full zero', 'full pressed', d.querySelector('[data-plot="full"]').getAttribute('aria-pressed') === 'true' ? 'full pressed' : 'near pressed',
      d.querySelector('[data-plot="full"]').getAttribute('aria-pressed') === 'true' && d.querySelector('[data-plot="near"]').getAttribute('aria-pressed') === 'false');
  const sel = id => d.getElementById(id).selectedOptions[0]?.textContent || '';
  const defaultHash = '#' + w.BTS_APP.shareCode();
  row('The plain page keeps a clean address', 'no settings code', w.location.hash || 'no settings code', !w.location.hash);
  // A style that sets display on an element overrides its hidden attribute; every hidden element must really be hidden.
  const leaks = Array.from(d.querySelectorAll('[hidden]')).filter(e => getComputedStyle(e).display !== 'none').map(e => e.id || e.className || e.tagName);
  row('Everything marked hidden is off the screen', 'none showing', leaks.length ? 'showing: ' + leaks.join(', ') : 'none showing', leaks.length === 0);
  try { w.localStorage.removeItem('bts.wind'); } catch (e) { /* storage blocked */ }

  // Caliber search.
  set(d, 'caliber-search', '350 leg');
  row('Search "350 leg" selects 350 Legend', '350 Legend', sel('caliber'), sel('caliber') === '350 Legend');
  row('Search narrows the list', '1 option', d.getElementById('caliber').options.length + ' options', d.getElementById('caliber').options.length === 1);
  row('Search updates the weight list', 'includes 170 gr', Array.from(d.getElementById('weight').options).some(o => o.textContent === '170 gr') ? 'includes 170 gr' : 'missing', Array.from(d.getElementById('weight').options).some(o => o.textContent === '170 gr'));
  set(d, 'caliber-search', 'zzzz');
  row('No match keeps the current caliber', '350 Legend', sel('caliber'), sel('caliber') === '350 Legend' && /No calibers match/.test(d.getElementById('caliber-count').textContent));
  set(d, 'caliber-search', '6.5 creed');
  row('Multi-word search', '6.5mm Creedmoor', sel('caliber'), sel('caliber') === '6.5mm Creedmoor');
  set(d, 'caliber-search', '');
  row('Clearing shows all calibers again', '189', String(d.getElementById('caliber').options.length), d.getElementById('caliber').options.length === 189);

  // Trajectory table.
  const rows = d.querySelectorAll('#traj-table tbody tr');
  row('Trajectory table has rows', '7 rows (100 yd is the zero)', rows.length + ' rows', rows.length === 7);
  const zeroRow = d.querySelector('#traj-table tr.zero-row td:nth-child(2)');
  row('Bullet is on the sight line at the zero', '0.00', zeroRow && zeroRow.textContent, zeroRow && zeroRow.textContent === '0.00');

  // Click calculator: 2.5 in low and 1 in left at 100 yd, 1/4 MOA clicks.
  set(d, 'c-click', 'moa:0.25', 'change');
  set(d, 'c-vert', '2.5'); set(d, 'c-vdir', 'low'); set(d, 'c-horiz', '1'); set(d, 'c-hdir', 'left');
  const elev = d.getElementById('c-elev').textContent, wind = d.getElementById('c-wind').textContent;
  row('Elevation for 2.5 in low', '10 clicks UP', elev, elev === '10 clicks UP');
  row('Windage for 1 in left', '4 clicks RIGHT', wind, wind === '4 clicks RIGHT');
  set(d, 'c-click', 'mil:0.1', 'change');
  row('Elevation in 0.1 mil clicks', '7 clicks UP', d.getElementById('c-elev').textContent, d.getElementById('c-elev').textContent === '7 clicks UP');
  set(d, 'c-vdir', 'high');
  row('Group high means dial down', '7 clicks DOWN', d.getElementById('c-elev').textContent, d.getElementById('c-elev').textContent === '7 clicks DOWN');
  set(d, 'c-range', '200');
  row('Farther shot needs fewer clicks', '3 clicks DOWN', d.getElementById('c-elev').textContent, d.getElementById('c-elev').textContent === '3 clicks DOWN');

  // My setups: save, change something, open the saved one again, delete.
  let storageOk = true;
  try { w.localStorage.setItem('bts.test', '1'); w.localStorage.removeItem('bts.test'); } catch (e) { storageOk = false; }
  if (!storageOk) {
    row('My setups disabled without storage', 'Save disabled', d.getElementById('saved-save').disabled ? 'Save disabled' : 'enabled', d.getElementById('saved-save').disabled);
  } else {
    const codeBefore = w.location.hash, calBefore = sel('caliber');
    set(d, 'saved-name', 'Test rifle');
    d.getElementById('saved-save').click();
    row('Saved setup appears in the list', 'Test rifle', sel('saved-list'), sel('saved-list') === 'Test rifle');
    row('Count badge shows 1', '1', d.getElementById('saved-count').textContent, d.getElementById('saved-count').textContent === '1');
    d.querySelector('[data-mode="pistol"]').click();
    row('Switched away to pistol', '9mm Luger (9x19mm)', sel('caliber'), sel('caliber') === '9mm Luger (9x19mm)');
    d.getElementById('saved-load').click();
    row('Opening the saved setup restores it', codeBefore + ' · ' + calBefore, w.location.hash + ' · ' + sel('caliber'), w.location.hash === codeBefore && sel('caliber') === calBefore);
    w.confirm = () => true;
    d.getElementById('saved-delete').click();
    row('Delete removes it', 'No saved setups yet', sel('saved-list'), sel('saved-list') === 'No saved setups yet');

    // Setups file: save to a JSON file, change everything, load the file back.
    set(d, 'saved-name', 'File rifle');
    d.getElementById('saved-save').click();
    set(d, 'wind', '15');
    set(d, 'wind-clock', '9', 'change');
    const fileCode = w.location.hash.slice(1);
    let blob = null, fileName = '';
    w.URL.createObjectURL = b => { blob = b; return 'blob:test'; };
    const realClick = w.HTMLAnchorElement.prototype.click;
    w.HTMLAnchorElement.prototype.click = function () { fileName = this.download; };
    d.getElementById('saved-export').click();
    w.HTMLAnchorElement.prototype.click = realClick;
    const json = blob ? JSON.parse(await blob.text()) : {};
    row('Save to file names the file by date', 'boresight-setups-YYYY-MM-DD.json', fileName, /^boresight-setups-\d{4}-\d\d-\d\d\.json$/.test(fileName));
    row('File holds the saved setup with a link', 'File rifle · ' + fileCode, (json.setups || []).map(s => s.name + ' · ' + s.code).join(', '),
        json.format === 'boresight-setups' && json.setups && json.setups.length === 1 && json.setups[0].name === 'File rifle' && json.setups[0].code === fileCode && json.setups[0].link.endsWith('#' + fileCode));
    row('File holds the current setup and settings', fileCode + ', 15 mph from 9', (json.current && json.current.code) + ', ' + (json.settings && json.settings.windMph) + ' mph from ' + (json.settings && json.settings.windClock),
        json.current && json.current.code === fileCode && json.settings.windMph === 15 && json.settings.windClock === 9 && json.settings.click === d.getElementById('c-click').value && json.settings.table.rifle.max === 300);
    // Change the setup and settings, delete the saved one, then load the file back through the file picker.
    d.getElementById('saved-delete').click();
    d.querySelector('[data-mode="pistol"]').click();
    set(d, 'wind', '5');
    set(d, 'wind-clock', '3', 'change');
    json.setups.push({ name: 'Bad entry', code: 'not-a-code' });
    json.settings.click = 'mil:0.1';
    json.settings.table.rifle = { max: 500, step: 100 };
    const pick = async (text, name = 'setups.json') => {
      const dt = new w.DataTransfer();
      dt.items.add(new w.File([text], name, { type: 'application/json' }));
      const input = d.getElementById('saved-file');
      input.files = dt.files;
      d.getElementById('toast').textContent = '';
      input.dispatchEvent(new Event('change'));
      for (let i = 0; i < 60 && !d.getElementById('toast').textContent; i++) await wait(50);   // reading the file is asynchronous
    };
    await pick(JSON.stringify(json));
    const names = Array.from(d.getElementById('saved-list').options).map(o => o.textContent);
    row('Loading the file restores the saved setup (and skips a bad entry)', 'File rifle', names.join(', '), names.length === 1 && names[0] === 'File rifle');
    row('Loading the file opens its current setup', fileCode + ' · ' + calBefore, w.location.hash.slice(1) + ' · ' + sel('caliber'), w.location.hash.slice(1) === fileCode && sel('caliber') === calBefore);
    row('Loading the file restores wind, table and click settings', '15 mph, 9 o\'clock, 500/100, mil:0.1',
        `${d.getElementById('wind').value} mph, ${d.getElementById('wind-clock').value} o'clock, ${d.getElementById('t-max').value}/${d.getElementById('t-step').value}, ${d.getElementById('c-click').value}`,
        d.getElementById('wind').value === '15' && d.getElementById('wind-clock').value === '9' && d.getElementById('t-max').value === '500' && d.getElementById('t-step').value === '100' &&
        d.getElementById('c-click').value === 'mil:0.1' && d.getElementById('card-click').value === 'mil:0.1');
    await pick('{"hello": 1}');
    row('A JSON file from elsewhere is refused', 'isn’t a setups file', d.getElementById('toast').textContent, /isn’t a setups file/.test(d.getElementById('toast').textContent));
    await pick('not json at all');
    row('A broken file is refused', 'isn’t valid JSON', d.getElementById('toast').textContent, /isn’t valid JSON/.test(d.getElementById('toast').textContent));
    d.getElementById('saved-delete').click();
    ['bts.wind', 'bts.windclock', 'bts.click', 'bts.table.rifle', 'bts.table.pistol', 'bts.table.shotgun'].forEach(k => w.localStorage.removeItem(k));
  }

  // Wind drift and MOA / mil columns. Columns: range, path in/MOA/mil, drift in/MOA/mil, velocity, energy, time.
  await load('');
  {
    const d = frame.contentDocument, w = frame.contentWindow;
    const cells = r => Array.from(d.querySelectorAll('#traj-table tbody tr')[r].cells).map(c => c.textContent);
    const num = s => parseFloat(s.replace('−', '-'));
    row('Crosswind defaults to 10 mph', '10 mph', d.getElementById('wind').value + ' ' + d.getElementById('wind-unit').textContent, d.getElementById('wind').value === '10' && d.getElementById('wind-unit').textContent === 'mph');
    row('Wind defaults to 3 o\'clock, drift shown as left', "3 o'clock · Drift left", sel2(d, 'wind-clock') + ' · ' + (d.querySelector('#traj-table thead').textContent.match(/Drift \w+/)?.[0] || 'missing'),
        d.getElementById('wind-clock').value === '3' && /Drift left/.test(d.querySelector('#traj-table thead').textContent));
    const last = cells(6);   // 300 yd
    row('Table has 10 columns', '10', String(last.length), last.length === 10);
    const moa = num(last[1]) / (1.0472 * 3), mil = num(last[1]) / (3.6 * 3);
    row('Path MOA and mil match inches at 300 yd', moa.toFixed(1) + ' / ' + mil.toFixed(2), last[2] + ' / ' + last[3], Math.abs(num(last[2]) - moa) < 0.051 && Math.abs(num(last[3]) - mil) < 0.006);
    const drift10 = num(last[4]);
    row('300 yd drift in a 10 mph wind', '7 to 10 in', last[4] + ' in', drift10 > 7 && drift10 < 10);
    set(d, 'wind', '20');
    const drift20 = num(cells(6)[4]);
    row('20 mph doubles the drift', (drift10 * 2).toFixed(2) + ' ±0.01', drift20.toFixed(2), Math.abs(drift20 - drift10 * 2) <= 0.011);
    let saved = null; try { saved = w.localStorage.getItem('bts.wind'); } catch (e) { saved = 'n/a'; }
    row('Wind is remembered', '20', String(saved), saved === '20' || saved === 'n/a');
    row('Wind is not in the share link', defaultHash, '#' + w.BTS_APP.shareCode(), '#' + w.BTS_APP.shareCode() === defaultHash && !w.location.hash);
    set(d, 'wind', '');
    row('Blank wind means no drift', '0.00', cells(6)[4], cells(6)[4] === '0.00');
    set(d, 'wind', '10');
    d.querySelector('[data-units="metric"]').click();
    row('Metric shows the wind in km/h', '16.1 km/h', d.getElementById('wind').value + ' ' + d.getElementById('wind-unit').textContent, d.getElementById('wind').value === '16.1' && d.getElementById('wind-unit').textContent === 'km/h');
    d.querySelector('[data-units="english"]').click();
    row('Back to imperial keeps 10 mph', '10', d.getElementById('wind').value, d.getElementById('wind').value === '10');

    // Wind direction: 9 o'clock mirrors 3 o'clock, 1 o'clock is half the crosswind, 12 o'clock has none.
    const head = () => d.querySelector('#traj-table thead').textContent;
    set(d, 'wind-clock', '9', 'change');
    row('9 o\'clock wind drifts right by the same amount', 'Drift right · ' + drift10.toFixed(2), (head().match(/Drift \w+/)?.[0] || '') + ' · ' + cells(6)[4], /Drift right/.test(head()) && Math.abs(num(cells(6)[4]) - drift10) < 0.006);
    set(d, 'wind-clock', '1', 'change');
    row('1 o\'clock wind is half the crosswind', (drift10 / 2).toFixed(2) + ' ±0.01', cells(6)[4], Math.abs(num(cells(6)[4]) - drift10 / 2) <= 0.011);
    set(d, 'wind-clock', '12', 'change');
    row('12 o\'clock wind has no drift', 'no crosswind, 0.00', (/no crosswind/.test(head()) ? 'no crosswind' : head().match(/Drift[^A-Z]*/)?.[0]) + ', ' + cells(6)[4], /no crosswind/.test(head()) && cells(6)[4] === '0.00');
    let clockSaved = null; try { clockSaved = w.localStorage.getItem('bts.windclock'); } catch (e) { clockSaved = 'n/a'; }
    row('Wind direction is remembered', '12', String(clockSaved), clockSaved === '12' || clockSaved === 'n/a');
    set(d, 'wind-clock', '3', 'change');

    // Table extent: out to / every, remembered per firearm type.
    const ranges = () => Array.from(d.querySelectorAll('#traj-table tbody tr')).map(tr => parseFloat(tr.cells[0].textContent));
    row('Rifle table defaults to 300 every 50', '300 / 50 · 25…300', d.getElementById('t-max').value + ' / ' + d.getElementById('t-step').value + ' · ' + ranges()[0] + '…' + ranges().slice(-1)[0],
        d.getElementById('t-max').value === '300' && d.getElementById('t-step').value === '50' && ranges().join() === '25,50,100,150,200,250,300');
    set(d, 't-max', '600');
    row('Out to 600 yd adds rows', '13 rows, last 600', ranges().length + ' rows, last ' + ranges().slice(-1)[0], ranges().length === 13 && ranges().slice(-1)[0] === 600);
    set(d, 't-step', '100', 'change');
    row('Every 100 yd keeps the 25 yd row and the zero', '25,100,200,300,400,500,600', ranges().join(), ranges().join() === '25,100,200,300,400,500,600');
    set(d, 't-max', '2000'); set(d, 't-step', '25', 'change');
    row('Very long tables stop at 40 rows', '40 rows and a note', ranges().length + ' rows' + (/first 40/.test(d.getElementById('traj-hint').textContent) ? ' and a note' : ''), ranges().length === 40 && /first 40/.test(d.getElementById('traj-hint').textContent));
    set(d, 't-max', '1000');
    let tableSaved = null; try { tableSaved = w.localStorage.getItem('bts.table.rifle'); } catch (e) { tableSaved = 'n/a'; }
    row('Table extent is remembered', '1000:25', String(tableSaved), tableSaved === '1000:25' || tableSaved === 'n/a');
    d.querySelector('[data-mode="pistol"]').click();
    row('Pistol has its own table: 150 every 25', '10,25,50,75,100,125,150', ranges().join(), d.getElementById('t-max').value === '150' && ranges().join() === '10,25,50,75,100,125,150');
    d.querySelector('[data-mode="rifle"]').click();
    row('Back to rifle restores its table', '1000 / 25', d.getElementById('t-max').value + ' / ' + d.getElementById('t-step').value, d.getElementById('t-max').value === '1000' && d.getElementById('t-step').value === '25');
  }

  // Range card and long report, with the rifle table out to 1000 every 25 (set above) and 1/4 MOA clicks.
  try { frame.contentWindow.localStorage.setItem('bts.click', 'moa:0.25'); } catch (e) { /* storage blocked */ }
  await load('#preview-report');
  {
    const sheets = frame.contentDocument.querySelectorAll('#print-root .sheet');
    row('A 40-row table puts the report trajectory on page 2', '2 pages, 40 rows', sheets.length + ' pages, ' + frame.contentDocument.querySelectorAll('#print-root .report-traj tr').length + ' rows incl. 2 header rows',
        sheets.length === 2 && frame.contentDocument.querySelectorAll('#print-root .report-traj tr').length === 42);
  }
  await load('#preview-card');
  {
    const t = frame.contentDocument.querySelector('#print-root svg')?.textContent || '';
    row('Long range card is 6 x 4 in, two columns', '6 × 4 and 1000 yd row', (/6 × 4 in/.test(t) ? '6 × 4' : 'other size') + (/1000/.test(t) ? ' and 1000 yd row' : ''), /6 × 4 in/.test(t) && /1000/.test(t));
  }
  try { ['bts.table.rifle'].forEach(k => frame.contentWindow.localStorage.removeItem(k)); } catch (e) { /* storage blocked */ }
  await load('#preview-card');
  {
    const texts = Array.from(frame.contentDocument.querySelectorAll('#print-root svg text')).map(x => x.textContent);
    // 308 defaults at 300 yd: 4.5 MOA low = 18 clicks up; 2.8 MOA drift left in a 3 o'clock wind = 11 clicks right.
    const i300 = texts.indexOf('300');
    const r300 = texts.slice(i300, i300 + 5).join(' ');
    row('Range card: 300 yd clicks for the default 308', '300 18 U 4.5 11 R 2.8', r300, r300 === '300 18 U 4.5 11 R 2.8');
    row('Default range card is 3 x 5 in', '5 × 3 in', texts.find(x => /Cut along/.test(x)) || 'missing', texts.some(x => /5 × 3 in/.test(x)));
  }

  // Point-blank range card with the default 308 (100 yd zero) and a 6 in vital zone.
  try { frame.contentWindow.localStorage.removeItem('bts.vital'); } catch (e) { /* storage blocked */ }
  await load('');
  {
    const d = frame.contentDocument, w = frame.contentWindow, txt = id => d.getElementById(id).textContent;
    row('Point-blank card sits after the chart', 'before the trajectory table', d.getElementById('pbr-card').nextElementSibling.id, d.getElementById('pbr-card').nextElementSibling.id === 'traj-card');
    row('Vital zone defaults to 6 in', '6 in', d.getElementById('pbr-zone').value + ' ' + txt('pbr-unit'), d.getElementById('pbr-zone').value === '6' && txt('pbr-unit') === 'in');
    row('Best point-blank range for the default 308', '0–270 yd', txt('pbr-best'), txt('pbr-best') === '0–270 yd');
    row('Best zero for the default 308', '231 yd', txt('pbr-zero'), txt('pbr-zero') === '231 yd');
    row('Point-blank range with the 100 yd zero', 'shorter than 270 yd', txt('pbr-yours') + ' · ' + txt('pbr-yours-sub'), /^0–1\d\d yd$/.test(txt('pbr-yours')) && /100 yd zero/.test(txt('pbr-yours-sub')));
    row('Button offers the nearest zero choice not above the best', 'Use 225 yd zero', txt('pbr-use'), txt('pbr-use') === 'Use 225 yd zero' && !d.getElementById('pbr-use').disabled);
    d.getElementById('pbr-use').click();
    row('Using it sets the zero and updates the table', '225 yd zero, table has 225', sel2(d, 'zero') + ', ' + (d.querySelector('#traj-table tr.zero-row td')?.textContent || ''),
        sel2(d, 'zero') === '225 yd' && /^225/.test(d.querySelector('#traj-table tr.zero-row td')?.textContent || ''));
    row('With the 225 yd zero, almost the full range', '0–26x yd, button shows it is in use', txt('pbr-yours') + ' · ' + txt('pbr-use'),
        /^0–26\d yd$/.test(txt('pbr-yours')) && d.getElementById('pbr-use').disabled && txt('pbr-use') === 'Using 225 yd zero');
    set(d, 'pbr-zone', '4');
    row('A 4 in zone shortens the range and the best zero', 'best under 270, zero under 231', txt('pbr-best') + ' · ' + txt('pbr-zero'),
        parseInt(txt('pbr-best').split('–')[1], 10) < 270 && parseInt(txt('pbr-zero'), 10) < 231);
    row('The 225 yd zero now rises above a 4 in zone', 'Rises too high', txt('pbr-yours') + ' · ' + txt('pbr-yours-sub'), txt('pbr-yours') === 'Rises too high' && /above the zone/.test(txt('pbr-yours-sub')));
    let saved = null; try { saved = w.localStorage.getItem('bts.vital'); } catch (e) { saved = 'n/a'; }
    row('Vital zone is remembered', '4', String(saved), saved === '4' || saved === 'n/a');
    d.querySelector('[data-units="metric"]').click();
    row('Metric shows the zone in cm and ranges in m', '10.2 cm, m', d.getElementById('pbr-zone').value + ' ' + txt('pbr-unit') + ', ' + txt('pbr-best'),
        d.getElementById('pbr-zone').value === '10.2' && txt('pbr-unit') === 'cm' && / m$/.test(txt('pbr-best')));
    d.querySelector('[data-units="english"]').click();
    try { w.localStorage.removeItem('bts.vital'); } catch (e) { /* storage blocked */ }
  }

  // Range card section on the page: the same drawing as the printout, its own click selector kept in step with the calculator.
  await load('');
  {
    const d = frame.contentDocument, card = d.getElementById('range-card');
    const texts = () => Array.from(d.querySelectorAll('#card-preview svg text')).map(x => x.textContent);
    const at300 = () => { const t = texts(), i = t.indexOf('300'); return t.slice(i, i + 5).join(' '); };
    row('Range card section follows the trajectory table', 'right after the table', card.previousElementSibling && card.previousElementSibling.id, card.previousElementSibling && card.previousElementSibling.id === 'traj-card');
    row('Print range card button is in the range card section', 'in #range-card', card.contains(d.getElementById('print-card')) ? 'in #range-card' : 'elsewhere', card.contains(d.getElementById('print-card')));
    row('Preview shows the same 300 yd row as the printout', '300 18 U 4.5 11 R 2.8', at300(), at300() === '300 18 U 4.5 11 R 2.8');
    row('Card hint gives the printed size', '5 × 3 in', d.getElementById('card-hint').textContent, /5 × 3 in on Letter/.test(d.getElementById('card-hint').textContent));
    set(d, 'card-click', 'mil:0.1', 'change');
    row('Card click size changes the calculator too', 'mil:0.1 / mil:0.1', d.getElementById('card-click').value + ' / ' + d.getElementById('c-click').value, d.getElementById('c-click').value === 'mil:0.1');
    row('Card redraws in mil clicks', 'mil header and 0.1 mil label', texts().some(x => /0\.1 mil per click/.test(x)) ? 'mil' : 'still MOA', texts().some(x => /0\.1 mil per click/.test(x)) && texts().includes('mil'));
    set(d, 'c-click', 'moa:0.25', 'change');
    row('Calculator click size changes the card', 'moa:0.25 and 300 yd row back', d.getElementById('card-click').value + ' · ' + at300(), d.getElementById('card-click').value === 'moa:0.25' && at300() === '300 18 U 4.5 11 R 2.8');
    set(d, 'wind', '20');
    row('Card follows the crosswind', '300 yd wind 22 R', at300(), / 22 R /.test(at300()));
    set(d, 'wind', '10'); d.getElementById('wind').dispatchEvent(new Event('blur'));

    // Zoom: the range card fills the window, its drawing grows, and Escape or the button restores it.
    const zoom = d.getElementById('card-zoom'), svgW = () => d.querySelector('#card-preview svg').getBoundingClientRect().width;
    const w0 = svgW();
    zoom.click();
    const rc = card.getBoundingClientRect(), win = frame.contentWindow;
    row('Zoom button maximizes the range card', 'fills the window', card.classList.contains('maximized') && getComputedStyle(card).position === 'fixed' ? `${Math.round(rc.width)} x ${Math.round(rc.height)}` : 'not maximized',
        card.classList.contains('maximized') && Math.round(rc.width) === win.innerWidth && Math.round(rc.height) === win.innerHeight);
    row('Maximized card drawing is larger', '> ' + Math.round(w0) + ' px', Math.round(svgW()) + ' px', svgW() > w0 * 1.3);
    row('Maximized card keeps the print button and click size', 'both visible', ['print-card', 'card-click'].map(id => d.getElementById(id).getBoundingClientRect().width > 0 ? id : 'hidden').join(', '),
        ['print-card', 'card-click'].every(id => d.getElementById(id).getBoundingClientRect().width > 0));
    d.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
    row('Escape restores the range card', 'restored', card.classList.contains('maximized') ? 'still maximized' : 'restored', !card.classList.contains('maximized') && Math.abs(svgW() - w0) < 1);
    zoom.click(); zoom.click();
    row('Zoom button restores it too', 'restored, label Maximize', (card.classList.contains('maximized') ? 'maximized' : 'restored') + ', label ' + zoom.getAttribute('aria-label').split(' ')[0],
        !card.classList.contains('maximized') && zoom.getAttribute('aria-label') === 'Maximize range card' && !d.body.classList.contains('card-open'));
    const chartCard = d.querySelector('.chart-card');
    d.getElementById('chart-zoom').click();
    const chartOk = chartCard.classList.contains('maximized') && chartCard.querySelector('#chart svg').getBoundingClientRect().height > 500;
    d.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
    row('Chart zoom still works', 'maximized, then restored', chartOk ? (chartCard.classList.contains('maximized') ? 'stuck maximized' : 'maximized, then restored') : 'not maximized', chartOk && !chartCard.classList.contains('maximized'));
  }

  // Barrel length: 16 in barrel on the default 308 (test barrel 24 in, 25 fps per in) = 200 fps slower.
  // A code is 12 characters, + 6 for your own load, + 7 for the barrel, so only the length tells whether a barrel is in it.
  const hasBarrel = h => (h.length - 1 - 12) % 6 === 1;
  {
    await load('');
    const d2 = frame.contentDocument, w2 = frame.contentWindow;
    const v0 = Number(d2.getElementById('velocity').value);
    row('Barrel adjustment is off by default', 'unchecked, fields hidden', (d2.getElementById('barrel-on').checked ? 'checked' : 'unchecked') + (d2.getElementById('barrel-row').hidden ? ', fields hidden' : ', fields shown'),
        !d2.getElementById('barrel-on').checked && d2.getElementById('barrel-row').hidden);
    d2.getElementById('barrel-on').click();
    row('Checking it shows the defaults', 'test 24, 25 per in', `test ${d2.getElementById('barrel-ref').value}, ${d2.getElementById('barrel-rate').value} per in` + (d2.getElementById('barrel-row').hidden ? ' (hidden)' : ''),
        !d2.getElementById('barrel-row').hidden && d2.getElementById('barrel-ref').value === '24' && d2.getElementById('barrel-rate').value === '25');
    set(d2, 'barrel-len', '16');
    const v1 = Number(d2.getElementById('velocity').value);
    row('16 in barrel lowers velocity by 200 fps', (v0 - 200) + ' fps', v1 + ' fps', v1 === v0 - 200);
    row('Barrel note explains the change', 'lowered by 200 fps', d2.getElementById('barrel-note').textContent, /lowered by 200 fps/.test(d2.getElementById('barrel-note').textContent));
    const hash = w2.location.hash;
    row('Barrel goes into the share link', '…b…', hash, hasBarrel(hash) && /b[0-9a-z]{6}$/.test(hash));
    d2.getElementById('barrel-on').click();
    row('Unchecking removes the adjustment', v0 + ' fps, no barrel in link', d2.getElementById('velocity').value + ' fps' + (hasBarrel(w2.location.hash) ? ', barrel still in link' : ', no barrel in link'),
        Number(d2.getElementById('velocity').value) === v0 && !hasBarrel(w2.location.hash));
    await load(hash);
    const d3 = frame.contentDocument;
    row('Link restores the barrel (checked) and velocity', 'checked, 16 / ' + (v0 - 200), (d3.getElementById('barrel-on').checked ? 'checked, ' : 'unchecked, ') + d3.getElementById('barrel-len').value + ' / ' + d3.getElementById('velocity').value,
        d3.getElementById('barrel-on').checked && d3.getElementById('barrel-len').value === '16' && Number(d3.getElementById('velocity').value) === v0 - 200);
    set(d3, 'velocity', '2700');
    row('Own velocity is not adjusted', '2700 and a note', d3.getElementById('velocity').value + ' · ' + d3.getElementById('barrel-note').textContent.slice(0, 40),
        d3.getElementById('velocity').value === '2700' && /isn’t applied/.test(d3.getElementById('barrel-note').textContent));
    d3.querySelector('[data-mode="pistol"]').click();
    row('Pistol resets barrel: off, 4 in test barrel', 'unchecked, empty / 4', (d3.getElementById('barrel-on').checked ? 'checked, ' : 'unchecked, ') + (d3.getElementById('barrel-len').value || 'empty') + ' / ' + d3.getElementById('barrel-ref').value,
        !d3.getElementById('barrel-on').checked && d3.getElementById('barrel-len').value === '' && d3.getElementById('barrel-ref').value === '4');
    d3.querySelector('[data-mode="shotgun"]').click();
    row('Shotgun hides the barrel fields', 'hidden', d3.getElementById('barrel-field').hidden ? 'hidden' : 'shown', d3.getElementById('barrel-field').hidden);
    await load('');
  }

  // Collapsible cards: chevron and title both toggle, the state is remembered, and the chart redraws on reopen.
  {
    const d = frame.contentDocument, w = frame.contentWindow;   // the barrel checks above reloaded the page
    const cards = Array.from(d.querySelectorAll('[data-collapse]'));
    row('Every main card is collapsible', '7 cards with a chevron', cards.filter(c => c.querySelector('.fold-btn')).length + ' cards', cards.length === 7 && cards.every(c => c.querySelector('.fold-btn')));
    // Each card's body must actually disappear when folded (a card-specific style once kept the click calculator open).
    const stuck = cards.filter(c => {
      c.querySelector('.fold-btn').click();
      const gone = getComputedStyle(c.querySelector('.card-body')).display === 'none';
      c.querySelector('.fold-btn').click();
      return !gone;
    }).map(c => c.dataset.collapse);
    row('Every card body hides when folded', 'all hide', stuck.length ? 'stays visible: ' + stuck.join(', ') : 'all hide', stuck.length === 0);
    const chart = d.querySelector('.chart-card');
    chart.querySelector('.fold-btn').click();
    const hidden = getComputedStyle(chart.querySelector('.card-body')).display === 'none';
    row('Chevron collapses the chart', 'body hidden', hidden ? 'body hidden' : 'still visible', hidden && chart.classList.contains('collapsed'));
    let remembered = null; try { remembered = w.localStorage.getItem('bts.fold.chart'); } catch (e) { remembered = 'n/a'; }
    row('Collapsed state is remembered', 'closed', String(remembered), remembered === 'closed' || remembered === 'n/a');
    chart.querySelector('h2').click();
    const svg = chart.querySelector('#chart svg');
    row('Clicking the title reopens and redraws', 'open with chart', !chart.classList.contains('collapsed') && svg ? 'open with chart' : 'not restored', !chart.classList.contains('collapsed') && !!svg && svg.getBoundingClientRect().width > 200);
    const setup = d.querySelector('.setup');
    setup.querySelector('.fold-btn').click();
    row('Chevron inside a title toggles once', 'collapsed', setup.classList.contains('collapsed') ? 'collapsed' : 'open', setup.classList.contains('collapsed'));
    setup.querySelector('.fold-btn').click();
    row('Near/Full buttons still work inside the chart header', 'near pressed, chart open', (d.querySelector('[data-plot="near"]').click(), d.querySelector('[data-plot="near"]').getAttribute('aria-pressed')) + (chart.classList.contains('collapsed') ? ', collapsed' : ', chart open'),
        d.querySelector('[data-plot="near"]').getAttribute('aria-pressed') === 'true' && !chart.classList.contains('collapsed'));
    d.querySelector('[data-plot="full"]').click();   // back to the default, which the QR checks below expect
  }

  // Shot angle: the table and range card change, the boresight solution doesn't.
  await load('');
  {
    const d = frame.contentDocument, w = frame.contentWindow, $ = id => d.getElementById(id);
    const opts = Array.from($('slope').options).map(o => o.textContent);
    row('Shot angle offers 60° down to 60° up', '25 choices, Level selected', opts.length + ' choices, ' + sel2(d, 'slope') + ' selected', opts.length === 25 && opts[0] === '60° down' && opts[24] === '60° up' && sel2(d, 'slope') === 'Level');
    const at300 = () => { const r = Array.from(d.querySelectorAll('#traj-table tbody tr')).find(tr => tr.cells[0].textContent === '300'); return r ? parseFloat(r.cells[1].textContent.replace('−', '-')) : NaN; };
    const level = at300(), meet = $('meet').textContent;
    set(d, 'slope', '30', 'change');
    const up = at300();
    row('A 30° uphill shot hits higher at 300 yd', `above ${level}`, String(up), up > level + 0.5);
    row('Shot angle is named under the table and on the range card', '30° uphill', /30° uphill/.test($('traj-hint').textContent) && /30° uphill/.test($('card-preview').textContent) ? '30° uphill in both' : 'missing',
        /30° uphill: ranges are line-of-sight/.test($('traj-hint').textContent) && /30° uphill/.test($('card-preview').textContent));
    row('Shot angle leaves the meet distance alone', meet, $('meet').textContent, $('meet').textContent === meet);
    let kept = null; try { kept = w.localStorage.getItem('bts.slope'); } catch (e) { kept = 'n/a'; }
    row('Shot angle is remembered', '30', String(kept), kept === '30' || kept === 'n/a');
    set(d, 'slope', '-30', 'change');
    row('A 30° downhill shot also hits higher', `above ${level}`, String(at300()), at300() > level + 0.5 && /30° downhill/.test($('traj-hint').textContent));
    set(d, 'slope', '0', 'change');
    row('Level again', String(level), String(at300()), at300() === level && !/uphill|downhill/.test($('traj-hint').textContent));
  }

  // My loads: add, use, share by link, save from a link, edit, metric, setups file, delete.
  await load('');
  if (storageOk) {
    let d = frame.contentDocument, w = frame.contentWindow, $ = id => d.getElementById(id);
    const shown = id => getComputedStyle($(id)).display !== 'none';
    w.localStorage.removeItem('bts.loads');
    await load('');
    d = frame.contentDocument; w = frame.contentWindow;
    row('Add-load form starts hidden, with the current load', 'hidden; 150 / 2790 / 0.370 after opening',
        (!shown('load-form') ? 'hidden; ' : 'shown; ') + ($('load-add').click(), `${$('lf-weight').value} / ${$('lf-velocity').value} / ${$('lf-bc').value}`),
        $('lf-weight').value === '150' && $('lf-bc').value === $('bc').value && $('lf-velocity').value === $('velocity').value && shown('load-form'));
    set(d, 'lf-name', 'Test 168 handload'); set(d, 'lf-weight', '168'); set(d, 'lf-velocity', '2650'); set(d, 'lf-bc', '0.462');
    $('lf-save').click();
    row('Saving a load selects it', 'Test 168 handload · 168 gr · 2650 fps · 0.462', `${sel2(d, 'caliber')} · ${sel2(d, 'weight')} · ${$('velocity').value} fps · ${$('bc').value}`,
        sel2(d, 'caliber') === 'Test 168 handload' && sel2(d, 'weight') === '168 gr' && $('velocity').value === '2650' && $('bc').value === '0.462' && !shown('load-form'));
    row('Its weight and shape are fixed', 'both disabled', $('weight').disabled && $('shape').disabled ? 'both disabled' : 'editable', $('weight').disabled && $('shape').disabled);
    const groups = Array.from(d.querySelectorAll('#caliber optgroup')).map(g => g.label + ' ' + g.children.length);
    row('My loads come first in the caliber list', 'My loads 1, Calibers 189', groups.join(', '), groups.join(', ') === 'My loads 1, Calibers 189');
    const stored = JSON.parse(w.localStorage.getItem('bts.loads') || '[]');
    row('The load is kept in this browser', '1 rifle load', stored.length + ' ' + (stored[0] && stored[0].mode) + ' load', stored.length === 1 && stored[0].fps === 2650 && stored[0].grains === 168);
    row('Edit and Delete show for a saved load', 'shown', !$('load-edit').hidden && !$('load-delete').hidden && $('load-keep').hidden ? 'shown' : 'hidden', !$('load-edit').hidden && !$('load-delete').hidden && $('load-keep').hidden);
    const loadHash = w.location.hash;
    row('The link carries the load', '…c…~Test%20168%20handload', loadHash, /c[0-9a-z]{9}~Test%20168%20handload$/.test(loadHash));
    set(d, 'caliber-search', 'handload');
    row('Search finds my load', 'Test 168 handload', sel2(d, 'caliber'), sel2(d, 'caliber') === 'Test 168 handload' && $('caliber').options.length === 1);
    set(d, 'caliber-search', '');
    // Open the link where the load isn't saved.
    w.localStorage.removeItem('bts.loads');
    await load(loadHash);
    d = frame.contentDocument; w = frame.contentWindow;
    row('A link opens a load that isn’t saved here', 'Test 168 handload (from link) · 2650', sel2(d, 'caliber') + ' · ' + $('velocity').value, sel2(d, 'caliber') === 'Test 168 handload (from link)' && $('velocity').value === '2650');
    row('The link keeps the same code', loadHash, w.location.hash, w.location.hash === loadHash);
    row('Save to my loads shows for a load from a link', 'shown, no Edit', !$('load-keep').hidden && $('load-edit').hidden ? 'shown, no Edit' : 'wrong buttons', !$('load-keep').hidden && $('load-edit').hidden);
    $('load-keep').click();
    row('Saving it from the link', 'Test 168 handload, 1 stored', sel2(d, 'caliber') + ', ' + JSON.parse(w.localStorage.getItem('bts.loads') || '[]').length + ' stored',
        sel2(d, 'caliber') === 'Test 168 handload' && JSON.parse(w.localStorage.getItem('bts.loads') || '[]').length === 1 && $('load-keep').hidden);
    $('load-edit').click();
    row('Edit fills the form with the load', '168 / 2650 / 0.462', `${$('lf-weight').value} / ${$('lf-velocity').value} / ${$('lf-bc').value}`, $('lf-weight').value === '168' && $('lf-velocity').value === '2650' && $('lf-name').value === 'Test 168 handload');
    set(d, 'lf-velocity', '2700');
    $('lf-save').click();
    row('Editing replaces the load', '2700 fps, still 1 load', $('velocity').value + ' fps, ' + JSON.parse(w.localStorage.getItem('bts.loads')).length + ' load', $('velocity').value === '2700' && JSON.parse(w.localStorage.getItem('bts.loads')).length === 1);
    $('load-add').click(); set(d, 'lf-name', 'Bad'); set(d, 'lf-velocity', '50'); $('lf-save').click();
    row('A bad velocity is refused', 'Enter a muzzle velocity…', $('lf-note').textContent, /muzzle velocity/.test($('lf-note').textContent) && shown('load-form'));
    $('lf-cancel').click();
    row('Cancel closes the form', 'not shown', shown('load-form') ? 'still shown' : 'not shown', !shown('load-form'));
    d.querySelector('[data-units="metric"]').click();
    row('In metric the load shows in grams and m/s', '10.89 g · 823 m/s', sel2(d, 'weight') + ' · ' + $('velocity').value + ' m/s', sel2(d, 'weight') === '10.89 g' && $('velocity').value === '823' && sel2(d, 'caliber') === 'Test 168 handload');
    d.querySelector('[data-units="english"]').click();
    row('The range card names the load', 'Test 168 handload', /Test 168 handload/.test($('card-preview').textContent) ? 'on the range card' : 'missing', /Test 168 handload/.test($('card-preview').textContent));
    // Setups file round trip.
    let blob = null;
    w.URL.createObjectURL = b => { blob = b; return 'blob:test'; };
    const realClick = w.HTMLAnchorElement.prototype.click;
    w.HTMLAnchorElement.prototype.click = function () {};
    $('saved-export').click();
    w.HTMLAnchorElement.prototype.click = realClick;
    const json = blob ? JSON.parse(await blob.text()) : {};
    row('Setups file holds my loads', 'Test 168 handload 2700', (json.loads || []).map(l => l.name + ' ' + l.fps).join(', '), json.loads && json.loads.length === 1 && json.loads[0].fps === 2700);
    w.confirm = () => true;
    $('load-delete').click();
    row('Deleting a load goes back to the default caliber', '308 Win (7.62x51mm), none stored', sel2(d, 'caliber') + ', ' + JSON.parse(w.localStorage.getItem('bts.loads')).length + ' stored',
        sel2(d, 'caliber') === '308 Win (7.62x51mm)' && JSON.parse(w.localStorage.getItem('bts.loads')).length === 0 && !d.querySelector('#caliber optgroup'));
    const dt = new w.DataTransfer();
    dt.items.add(new w.File([JSON.stringify(json)], 'setups.json', { type: 'application/json' }));
    $('saved-file').files = dt.files;
    $('toast').textContent = '';
    $('saved-file').dispatchEvent(new Event('change'));
    for (let i = 0; i < 60 && !$('toast').textContent; i++) await wait(50);
    row('Loading the file brings the load back and opens it', 'Test 168 handload · 2700, 1 load', `${sel2(d, 'caliber')} · ${$('velocity').value}, ${/1 load/.test($('toast').textContent) ? '1 load' : $('toast').textContent}`,
        sel2(d, 'caliber') === 'Test 168 handload' && $('velocity').value === '2700' && /1 load/.test($('toast').textContent));
    w.localStorage.removeItem('bts.loads');
  }

  // Reset: change settings, keep a saved setup and a load, then reset to the plain page.
  await load('');
  if (storageOk) {
    let d = frame.contentDocument, w = frame.contentWindow;
    w.localStorage.setItem('bts.saved', JSON.stringify([{ name: 'Keep me', code: '21000b000100' }]));
    w.localStorage.setItem('bts.loads', JSON.stringify([{ name: 'Kept load', mode: 'rifle', grains: 168, fps: 2650, bc: 0.462 }]));
    await load('');
    d = frame.contentDocument; w = frame.contentWindow;
    d.querySelector('[data-units="metric"]').click();
    set(d, 'paper', 'a4', 'change');
    set(d, 'slope', '20', 'change');
    set(d, 'wind', '25');
    set(d, 'caliber-search', '350 leg');
    d.querySelector('#traj-card .fold-btn').click();
    row('Settings changed before the reset', 'a code in the address', w.location.hash || 'none', /^#2/.test(w.location.hash));
    let asked = '';
    w.confirm = q => { asked = q; return false; };
    d.getElementById('reset-all').click();
    row('Reset asks first, and No changes nothing', 'still metric', d.querySelector('[data-units="metric"]').getAttribute('aria-pressed') === 'true' ? 'still metric' : 'reset anyway',
        /saved setups and loads are kept/.test(asked) && d.querySelector('[data-units="metric"]').getAttribute('aria-pressed') === 'true');
    w.confirm = () => true;
    await new Promise(res => { frame.onload = () => setTimeout(res, 50); d.getElementById('reset-all').click(); });
    d = frame.contentDocument; w = frame.contentWindow;
    const ls = w.localStorage, u = new URL(w.location.href);
    row('Reset opens the base URL', 'no query, no code', (u.search || 'no query') + ', ' + (u.hash || 'no code'), !u.search && !u.hash);
    row('Reset restores the defaults', 'Imperial, Letter, 308 Win, Level, 10 mph, table open',
        [d.querySelector('[data-units="english"]').getAttribute('aria-pressed') === 'true' ? 'Imperial' : 'Metric', sel2(d, 'paper'), sel2(d, 'caliber').split(' (')[0], sel2(d, 'slope'),
          d.getElementById('wind').value + ' mph', d.getElementById('traj-card').classList.contains('collapsed') ? 'table folded' : 'table open'].join(', '),
        d.querySelector('[data-units="english"]').getAttribute('aria-pressed') === 'true' && sel2(d, 'paper') === 'Letter' && sel2(d, 'caliber') === '308 Win (7.62x51mm)' &&
        sel2(d, 'slope') === 'Level' && d.getElementById('wind').value === '10' && !d.getElementById('traj-card').classList.contains('collapsed'));
    row('Reset keeps saved setups and loads', 'Keep me, Kept load', JSON.parse(ls.getItem('bts.saved') || '[]').map(s => s.name).concat(JSON.parse(ls.getItem('bts.loads') || '[]').map(l => l.name)).join(', ') + ' · others: ' + Object.keys(ls).filter(k => k.startsWith('bts.') && !['bts.saved', 'bts.loads'].includes(k)).join(' '),
        ls.getItem('bts.saved') && ls.getItem('bts.loads') && Object.keys(ls).filter(k => k.startsWith('bts.') && !['bts.saved', 'bts.loads'].includes(k) && !(k === 'bts.how' && ls.getItem(k) === 'open')).length === 0);
    set(d, 'zero', '3', 'change');
    row('Changing something after a reset writes the code again', 'a code in the address', w.location.hash || 'none', /^#2/.test(w.location.hash));
    ls.removeItem('bts.saved'); ls.removeItem('bts.loads');
    await load('');
  }

  // Sight-in sheet renders.
  await load('#preview-sightin');
  const sheet = frame.contentDocument.querySelector('#print-root svg');
  row('Sight-in target sheet renders', 'svg with grid', sheet ? 'svg, ' + sheet.querySelectorAll('line').length + ' lines' : 'missing', !!sheet && sheet.querySelectorAll('line').length > 20);

  // QR codes on every printed sheet decode to a link that opens this setup (the defaults here).
  // Opened from disk, the link points at the published site.
  const base = location.protocol === 'file:' ? 'https://bca3244.github.io/boresight-target/' : new URL('../index.html', location.href).href.replace(/index\.html$/, '');
  for (const kind of ['target', 'report', 'sightin']) {
    await load('#preview-' + kind);
    let got = 'no QR';
    const rect = frame.contentDocument.querySelector('#print-root rect.qr');
    if (rect && window.jsQR) {
      const x = +rect.getAttribute('x'), y = +rect.getAttribute('y'), s = +rect.getAttribute('width'), px = 400;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="${x} ${y} ${s} ${s}">${rect.outerHTML}${rect.nextElementSibling.outerHTML}</svg>`;
      const img = new Image();
      await new Promise(res => { img.onload = res; img.onerror = res; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
      const c = document.createElement('canvas'); c.width = c.height = px;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, px, px);
      const q = jsQR(g.getImageData(0, 0, px, px).data, px, px);
      got = q ? q.data : 'did not decode';
    } else if (!window.jsQR) got = 'decoder did not load';
    row(`QR on the ${kind} sheet opens this setup`, base + defaultHash, got, got === base + defaultHash);
  }

  document.getElementById('summary').textContent = `${pass} passed, ${fail} failed`;
  document.title = `UI ${pass} passed ${fail} failed`;
})();
</script>
</body>
</html>
